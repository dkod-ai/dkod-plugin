name: release
# One GitHub release per plugin version, tagged on the commit of main that first carried it. The newest
# release is marked latest, and the `stable` branch moves to it: the stable channel of install.sh, and a
# Claude Code marketplace added as dkod-ai/dkod-plugin@stable, follow it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag and release every new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          top=0.0.0; top_sha=
          for sha in $(git log --first-parent --reverse --format=%H HEAD -- .claude-plugin/plugin.json); do
            v=$(git show "$sha:.claude-plugin/plugin.json" | sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' | head -n 1)
            [ -n "$v" ] && newer "$v" "$top" || continue
            top=$v; top_sha=$sha
            if gh release view "v$v" >/dev/null 2>&1; then continue; fi
            # GitHub makes the tag. The CI token may not create a ref whose workflow files differ from main's,
            # so an old version's tag needs a person's token; a new version on main has main's workflows.
            gh release create "v$v" --target "$sha" --title "v$v" --generate-notes --latest=false
            echo "released v$v at $sha"
          done
          [ -n "$top_sha" ] || exit 0
          gh release edit "v$top" --latest
          # The stable branch only moves forward along main: the update is never forced.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$top_sha" >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$top_sha" >/dev/null
          echo "stable is v$top"
