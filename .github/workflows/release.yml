name: release
# main is the nightly channel: dkod-app publishes to it every night.
# - On a push to main: a new plugin version gets a GitHub pre-release (vX.Y.Z, "nightly"), tagged on the commit
#   of main that first carried it. The Releases list shows every nightly; stable stays "Latest".
# - Run by hand (Actions, release, Run workflow; or `gh workflow run release.yml --repo dkod-ai/dkod-plugin`):
#   main's version becomes stable. Its pre-release turns into a full release marked latest, and the `stable`
#   branch moves to it. The stable channel (install.sh, dk, and a Claude Code marketplace added as
#   dkod-ai/dkod-plugin@stable) follows that branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Nightly pre-release, or stable release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          version_at() { git show "$1:.claude-plugin/plugin.json" | sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' | head -n 1; }
          v=$(version_at HEAD)
          [ -n "$v" ] || { echo "main has no plugin version"; exit 1; }
          # The first commit of main that carried this version.
          sha=
          for c in $(git log --first-parent --reverse --format=%H HEAD -- .claude-plugin/plugin.json); do
            if [ "$(version_at "$c")" = "$v" ]; then sha=$c; break; fi
          done
          if [ "$EVENT" = push ]; then
            if gh release view "v$v" >/dev/null 2>&1; then echo "v$v has a release already"; exit 0; fi
            # GitHub makes the tag. The CI token may not create a ref whose workflow files differ from main's.
            gh release create "v$v" --target "$sha" --title "v$v (nightly)" --prerelease --latest=false \
              --notes "Nightly build of the DKOD plugin, on main. Install it with: dk channel nightly. It becomes stable when it is released by hand." \
              --generate-notes
            echo "nightly pre-release v$v at $sha"
            exit 0
          fi
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release edit "v$v" --title "v$v" --prerelease=false --latest
          else
            gh release create "v$v" --target "$sha" --title "v$v" --generate-notes --latest
          fi
          # The stable branch only moves forward along main: the update is never forced.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" -f sha="$sha" >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/stable -f sha="$sha" >/dev/null
          echo "stable is v$v"
