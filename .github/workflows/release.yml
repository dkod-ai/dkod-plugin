name: release
# One GitHub release per plugin version. Every version main has had gets its tag on the commit that
# first carried it, so the run that adds this workflow creates the releases of every earlier version
# too. The newest release is marked latest, and the `stable` branch moves to it: the stable channel
# of install.sh, and a Claude Code marketplace added as dkod-ai/dkod-plugin@stable, follow it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag and release every new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }
          top=0.0.0; top_sha=
          for sha in $(git log --first-parent --reverse --format=%H HEAD -- .claude-plugin/plugin.json); do
            v=$(git show "$sha:.claude-plugin/plugin.json" | sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' | head -n 1)
            [ -n "$v" ] && newer "$v" "$top" || continue
            top=$v; top_sha=$sha
            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then continue; fi
            git tag -a "v$v" "$sha" -m "dkod plugin $v"
            git push origin "refs/tags/v$v"
            gh release create "v$v" --verify-tag --title "v$v" --generate-notes --latest=false
            echo "released v$v at $sha"
          done
          [ -n "$top_sha" ] || exit 0
          gh release edit "v$top" --latest
          # The stable branch only moves forward along main, so this push never needs --force.
          git push origin "$top_sha:refs/heads/stable"
          echo "stable is v$top"
